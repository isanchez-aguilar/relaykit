name: release

# Publishes to npm (with provenance) and creates the GitHub release when a version
# tag is pushed:  git tag v0.2.0 && git push origin v0.2.0
# Publishing to npm here needs the NPM_TOKEN repository secret (an npm automation
# token). Without it the npm step only warns, and the GitHub release is still created.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Run the suite
        run: node --test
      - name: Publish to npm (skipped when this version is already there)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "relayrace-ai@$VERSION" version > /dev/null 2>&1; then
            echo "relayrace-ai@$VERSION is already on npm; nothing to publish"
          elif [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::No NPM_TOKEN secret, so nothing was published to npm. Publish by hand with npm publish; the GitHub release is still created."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
